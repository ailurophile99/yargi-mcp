[project]
name = "yargi-mcp"
version = "1.0.0"
description = "Türk Hukuk ve UYAP Mevzuat Kaynakları İçin Yerel MCP Sunucusu"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ailurophile99"}]
keywords = ["mcp", "turkish-law", "mevzuat", "uyap", "yargitay", "danistay", "emsal", "anayasa", "bedesten"]
dependencies = [
    "beautifulsoup4>=4.13.4",
    "httpx>=0.28.1",
    "markitdown[pdf]>=0.1.1",
    "pydantic>=2.11.4",
    "aiohttp>=3.11.18",
    "fastmcp>=2.10.5",
    "pypdf>=5.5.0",
    "numpy>=1.24.0",
    # Windows: onnxruntime >=1.21 eski VC++ runtime ile MSVCP140.dll erisim ihlali (0xC0000005) verip cokuyor.
    "onnxruntime==1.20.1; sys_platform == 'win32'",
]

[project.scripts]
yargi-mcp = "mcp_server_main:main"

[tool.setuptools]
py-modules = ["mcp_server_main"]

[tool.setuptools.packages.find]
include = ["*_mcp_module", "semantic_search"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
